# Anomaly Lens — pipeline configuration
# Every numeric/dir setting lives here; run_pipeline.py loads it via YAML.
pipeline:
  data_dir: "data"
  sources_dir: "data/sources"
  report_dir: "data/report"

  top_k: 10
  min_events_per_entity: 30
  tol_minutes: 25
  structuring_threshold: 10000.0
  with_models: true

  # seeds used by the synthetic generator when regenerating demo data
  seeds: [42, 99]